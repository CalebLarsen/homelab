---
- name: Ensure discord-bridge config directory exists
  ansible.builtin.file:
    path: "{{ config_root }}/discord-bridge"
    state: directory
    mode: '0755'
    owner: "{{ puid }}"
    group: "{{ pgid }}"

- name: Deploy discord bridge script
  ansible.builtin.copy:
    src: discord_bridge.py
    dest: "{{ config_root }}/discord-bridge/discord_bridge.py"
    mode: '0755'
    owner: "{{ puid }}"
    group: "{{ pgid }}"
  notify: Restart discord-bridge
