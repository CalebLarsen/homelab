---
# roles/service_manager/tasks/api_wiring.yml
#
# Main dispatcher for service API provisioning.
# This file is only included during non-check-mode deployments.

- name: Set API key facts from secrets
  ansible.builtin.set_fact:
    service_manager_sonarr_api_key: "{{ api_keys.sonarr }}"
    service_manager_radarr_api_key: "{{ api_keys.radarr }}"
    service_manager_prowlarr_api_key: "{{ api_keys.prowlarr }}"

- name: Wait for Prowlarr API
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/system/status?apikey={{ service_manager_prowlarr_api_key }}"
    method: GET
  register: service_manager_prowlarr_status
  until: service_manager_prowlarr_status.status == 200
  retries: 10
  delay: 5
  no_log: true

- name: Run Prowlarr Tasks
  ansible.builtin.include_tasks: prowlarr_indexers.yml

- name: Get existing Prowlarr applications
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/applications"
    method: GET
    headers: { X-Api-Key: "{{ service_manager_prowlarr_api_key }}" }
  register: service_manager_prowlarr_apps
  no_log: true

# --- SERVICE DELEGATION ---

- name: Wire Sonarr
  ansible.builtin.include_tasks: per_service/sonarr_wiring.yml
  when: "'sonarr' in services | map(attribute='name') | list"

- name: Wire Radarr
  ansible.builtin.include_tasks: per_service/radarr_wiring.yml
  when: "'radarr' in services | map(attribute='name') | list"

# --- REMAINING WIRING ---

- name: Wait for Cleanuparr API to be ready
  ansible.builtin.uri:
    url: "http://localhost:11011/api/health"
    status_code: [200, 401, 403]
  retries: 5
  delay: 5
  when: "'cleanuparr' in services | map(attribute='name') | list"

# --- DISCORD BRIDGE PROVISIONING ---

- name: Wait for Discord Bridge
  ansible.builtin.wait_for:
    port: 9000
    host: localhost
    delay: 2
    timeout: 30
  when: "'discord-bridge' in services | map(attribute='name') | list"

# --- OVERSEERR PROVISIONING ---

- name: Check if Overseerr API is authenticated
  ansible.builtin.uri:
    url: "http://localhost:5055/api/v1/user"
    method: GET
    headers: { X-Api-Key: "{{ overseerr_secret.api_key }}" }
  register: service_manager_overseerr_auth_check
  failed_when: false
  changed_when: false

- name: Provision Overseerr (Only if authenticated)
  when: "service_manager_overseerr_auth_check.status == 200"
  no_log: true
  block:
    - name: Trigger Plex user import
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/plex/users"
        method: POST
        headers: { X-Api-Key: "{{ overseerr_secret.api_key }}" }
      failed_when: false

    - name: Get existing Overseerr users
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/user"
        method: GET
        headers: { X-Api-Key: "{{ overseerr_secret.api_key }}" }
      register: service_manager_existing_users

    - name: Fetch existing tags from Radarr
      ansible.builtin.uri:
        url: "http://localhost:7878/api/v3/tag"
        method: GET
        headers: { X-Api-Key: "{{ api_keys.radarr }}" }
      register: service_manager_radarr_tags_raw

    - name: Fetch existing tags from Sonarr
      ansible.builtin.uri:
        url: "http://localhost:8989/api/v3/tag"
        method: GET
        headers: { X-Api-Key: "{{ api_keys.sonarr }}" }
      register: service_manager_sonarr_tags_raw

    - name: Set tag facts
      ansible.builtin.set_fact:
        service_manager_radarr_tags: "{{ service_manager_radarr_tags_raw.json }}"
        service_manager_sonarr_tags: "{{ service_manager_sonarr_tags_raw.json }}"

    - name: Ensure user tags exist in Radarr
      ansible.builtin.uri:
        url: "http://localhost:7878/api/v3/tag"
        method: POST
        headers: { X-Api-Key: "{{ api_keys.radarr }}" }
        body_format: json
        body: { label: "{{ item.label }}" }
        status_code: [201]
      loop: "{{ overseerr_secret.users }}"
      when:
        - item.label is defined
        - item.label not in service_manager_radarr_tags | map(attribute='label') | list
      register: service_manager_radarr_tags_created

    - name: Ensure user tags exist in Sonarr
      ansible.builtin.uri:
        url: "http://localhost:8989/api/v3/tag"
        method: POST
        headers: { X-Api-Key: "{{ api_keys.sonarr }}" }
        body_format: json
        body: { label: "{{ item.label }}" }
        status_code: [201]
      loop: "{{ overseerr_secret.users }}"
      when:
        - item.label is defined
        - item.label not in service_manager_sonarr_tags | map(attribute='label') | list
      register: service_manager_sonarr_tags_created

    - name: Refresh tags if needed
      when: service_manager_radarr_tags_created is changed or service_manager_sonarr_tags_created is changed
      block:
        - name: Re-fetch tags from Radarr
          ansible.builtin.uri:
            url: "http://localhost:7878/api/v3/tag"
            method: GET
            headers: { X-Api-Key: "{{ api_keys.radarr }}" }
          register: service_manager_radarr_tags_refreshed

        - name: Re-fetch tags from Sonarr
          ansible.builtin.uri:
            url: "http://localhost:8989/api/v3/tag"
            method: GET
            headers: { X-Api-Key: "{{ api_keys.sonarr }}" }
          register: service_manager_sonarr_tags_refreshed

        - name: Update tag facts
          ansible.builtin.set_fact:
            service_manager_radarr_tags: "{{ service_manager_radarr_tags_refreshed.json }}"
            service_manager_sonarr_tags: "{{ service_manager_sonarr_tags_refreshed.json }}"

    - name: Build Kometa tag mapping
      ansible.builtin.set_fact:
        service_manager_user_tags: "{{ _raw_json | from_json }}"
      vars:
        _raw_json: >-
          {% set results = {} %}
          {% for u in overseerr_secret.users if u.label is defined %}
            {% set tags = [u.label] %}
            {% for rt in (service_manager_radarr_tags | default([])) %}
              {% if rt.label is defined and u.label.lower() in rt.label.lower() %}
                {% set _ = tags.append(rt.label) %}
              {% endif %}
            {% endfor %}
            {% for st in (service_manager_sonarr_tags | default([])) %}
              {% if st.label is defined and u.label.lower() in st.label.lower() %}
                {% set _ = tags.append(st.label) %}
              {% endif %}
            {% endfor %}
            {% set _ = results.update({u.label: tags | unique | list}) %}
          {% endfor %}
          {{ results | to_json }}

    - name: Provision Overseerr users
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/user/{{ item_user.id }}"
        method: PUT
        headers: { X-Api-Key: "{{ overseerr_secret.api_key }}" }
        body_format: json
        body:
          permissions: "{{ item_config.permissions }}"
      loop: "{{ overseerr_secret.users }}"
      loop_control:
        loop_var: item_config
      vars:
        item_user: "{{ service_manager_existing_users.json.results | selectattr('email', 'equalto', item_config.email) | first | default(none) }}"
      when: item_user is not none

    - name: Get current Overseerr Radarr/Sonarr settings
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/{{ item }}"
        method: GET
        headers: { X-Api-Key: "{{ overseerr_secret.api_key }}" }
      register: service_manager_overseerr_settings
      loop: ["radarr", "sonarr"]

    - name: Enable Overseerr Auto-Tagging (Radarr/Sonarr)
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/{{ item.item }}/0"
        method: PUT
        headers: { X-Api-Key: "{{ overseerr_secret.api_key }}" }
        body_format: json
        body: >-
          {{ item.json[0]
             | combine({
                 'tagRequests': true,
                 'enableSeasonFolders': item.json[0].enableSeasonFolders | default(true)
               })
             | dict2items
             | rejectattr('key', 'equalto', 'id')
             | list
             | items2dict }}
        status_code: [200, 201]
      loop: "{{ service_manager_overseerr_settings.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.json | length > 0 and not (item.json[0].tagRequests | default(false))

    - name: Configure Overseerr Webhook for Custom Discord Bridge
      ansible.builtin.uri:
        url: "http://localhost:5055/api/v1/settings/notifications/webhook"
        method: POST
        headers: { X-Api-Key: "{{ overseerr_secret.api_key }}" }
        body_format: json
        body:
          enabled: true
          types: 256 # Media Available
          options:
            webhookUrl: "http://discord-bridge:9000/"
            jsonPayload: "{{ payload_data | to_json }}"
      vars:
        payload_data:
          subject: "{{ '{{' }}subject{{ '}}' }}"
          message: "{{ '{{' }}message{{ '}}' }}"
          email: "{{ '{{' }}requestedBy_email{{ '}}' }}"

    - name: Get existing notifications from Radarr
      ansible.builtin.uri:
        url: "http://localhost:7878/api/v3/notification"
        method: GET
        headers: { X-Api-Key: "{{ api_keys.radarr }}" }
      register: service_manager_radarr_notifications

    - name: Get existing notifications from Sonarr
      ansible.builtin.uri:
        url: "http://localhost:8989/api/v3/notification"
        method: GET
        headers: { X-Api-Key: "{{ api_keys.sonarr }}" }
      register: service_manager_sonarr_notifications

    - name: Register Discord Bridge in Radarr
      ansible.builtin.uri:
        url: "http://localhost:7878/api/v3/notification"
        method: POST
        headers: { X-Api-Key: "{{ api_keys.radarr }}" }
        body_format: json
        body:
          name: "Discord Bridge"
          onGrab: false
          onDownload: true
          onUpgrade: true
          onRename: false
          onMovieDelete: false
          onSeriesDelete: false
          onHealthIssue: false
          onApplicationUpdate: false
          implementation: "Webhook"
          configContract: "WebhookSettings"
          fields:
            - { name: "url", value: "http://discord-bridge:9000/" }
            - { name: "method", value: 1 } # POST
        status_code: [200, 201]
      when: "'Discord Bridge' not in service_manager_radarr_notifications.json | map(attribute='name') | list"

    - name: Register Discord Bridge in Sonarr
      ansible.builtin.uri:
        url: "http://localhost:8989/api/v3/notification"
        method: POST
        headers: { X-Api-Key: "{{ api_keys.sonarr }}" }
        body_format: json
        body:
          name: "Discord Bridge"
          onGrab: false
          onDownload: true
          onUpgrade: true
          onRename: false
          onMovieDelete: false
          onSeriesDelete: false
          onHealthIssue: false
          onApplicationUpdate: false
          implementation: "Webhook"
          configContract: "WebhookSettings"
          fields:
            - { name: "url", value: "http://discord-bridge:9000/" }
            - { name: "method", value: 1 } # POST
        status_code: [200, 201]
      when: "'Discord Bridge' not in service_manager_sonarr_notifications.json | map(attribute='name') | list"

    - name: Register Kometa Trigger Script in Radarr
      ansible.builtin.uri:
        url: "http://localhost:7878/api/v3/notification"
        method: POST
        headers: { X-Api-Key: "{{ api_keys.radarr }}" }
        body_format: json
        body:
          name: "Trigger Kometa"
          onGrab: false
          onDownload: true
          onUpgrade: true
          onRename: false
          onMovieDelete: false
          onSeriesDelete: false
          onHealthIssue: false
          onApplicationUpdate: false
          implementation: "CustomScript"
          configContract: "CustomScriptSettings"
          fields:
            - { name: "path", value: "/config/scripts/trigger-kometa.sh" }
        status_code: [200, 201]
      when: "'Trigger Kometa' not in service_manager_radarr_notifications.json | map(attribute='name') | list"

    - name: Register Kometa Trigger Script in Sonarr
      ansible.builtin.uri:
        url: "http://localhost:8989/api/v3/notification"
        method: POST
        headers: { X-Api-Key: "{{ api_keys.sonarr }}" }
        body_format: json
        body:
          name: "Trigger Kometa"
          onGrab: false
          onDownload: true
          onUpgrade: true
          onRename: false
          onMovieDelete: false
          onSeriesDelete: false
          onHealthIssue: false
          onApplicationUpdate: false
          implementation: "CustomScript"
          configContract: "CustomScriptSettings"
          fields:
            - { name: "path", value: "/config/scripts/trigger-kometa.sh" }
        status_code: [200, 201]
      when: "'Trigger Kometa' not in service_manager_sonarr_notifications.json | map(attribute='name') | list"

# --- PLEX PROVISIONING ---

- name: Get existing Plex libraries
  ansible.builtin.uri:
    url: "http://localhost:32400/library/sections"
    method: GET
    headers:
      X-Plex-Token: "{{ plex_secret.online_token }}"
      Accept: application/json
  register: service_manager_plex_libraries
  failed_when: false

- name: Provision Plex libraries
  ansible.builtin.uri:
    url: >-
      http://localhost:32400/library/sections?name={{ item.name | urlencode
      }}&type={{ item.type
      }}&agent={{ 'tv.plex.agents.movie' if item.type == 'movie' else 'tv.plex.agents.series'
      }}&scanner={{ ('Plex Movie' if item.type == 'movie' else 'Plex TV Series') | urlencode
      }}&language=en-US&location={{ item.path | urlencode }}
    method: POST
    headers: { X-Plex-Token: "{{ plex_secret.online_token }}" }
    status_code: 201
  loop: "{{ overseerr.libraries }}"
  when:
    - "service_manager_plex_libraries.status == 200"
    - >-
      item.name not in (
        service_manager_plex_libraries.json.MediaContainer.Directory
        | default([]) | map(attribute='title') | list
      )

- name: Enable Plex automatic library scanning
  ansible.builtin.uri:
    url: >-
      http://localhost:32400/:/prefs?FSEventLibraryUpdatesEnabled=1&FSEventLibraryPartialScanEnabled=1&ScheduledLibraryUpdatesEnabled=1&ScheduledLibraryUpdateInterval=3600
    method: PUT
    headers: { X-Plex-Token: "{{ plex_secret.online_token }}" }
    status_code: [200]
  when: "service_manager_plex_libraries.status == 200"

# --- CROSS-SEED PROVISIONING ---

- name: Get Prowlarr indexers for cross-seed
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/indexer"
    method: GET
    headers: { X-Api-Key: "{{ service_manager_prowlarr_api_key }}" }
  register: service_manager_prowlarr_indexers
  when: "'cross-seed' in services | map(attribute='name') | list"

- name: Template cross-seed config with discovered indexers
  ansible.builtin.template:
    src: cross-seed-config.js.j2
    dest: "{{ config_root }}/cross-seed/config.js"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0644"
  vars:
    cross_seed_indexers: "{{ service_manager_prowlarr_indexers.json | selectattr('enable', 'equalto', true) | list }}"
  when: "'cross-seed' in services | map(attribute='name') | list"
  notify: Restart cross-seed

# --- KOMETA PROVISIONING ---

- name: Template Kometa config with discovered tag mappings
  ansible.builtin.template:
    src: kometa_config.yml.j2
    dest: "{{ config_root }}/kometa/config.yml"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0644"
  when: "'kometa' in services | map(attribute='name') | list"
  notify: Restart kometa
