---
- name: Ensure shared Docker network exists
  community.docker.docker_network:
    name: "{{ docker_network }}"

- name: Set API key facts
  ansible.builtin.set_fact:
    service_manager_sonarr_api_key: "{{ api_keys.sonarr }}"
    service_manager_radarr_api_key: "{{ api_keys.radarr }}"
    service_manager_prowlarr_api_key: "{{ api_keys.prowlarr }}"
    service_manager_project_root: "{{ ansible_env.HOME }}/deploy"

- name: Ensure appdata and deployment directories exist (Parallel)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ _combined_dirs | from_json }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    _combined_dirs: >-
      {% set dirs = [] %}
      {% set _ = dirs.append({'path': service_manager_project_root}) %}
      {% set _ = dirs.append({'path': service_manager_project_root ~ '/ci-mock'}) %}
      {% set _ = dirs.append({'path': service_manager_project_root ~ '/seed-servarr'}) %}
      {% for s in services %}
        {% set _ = dirs.append({'path': service_manager_project_root ~ '/' ~ s.name}) %}
        {% set _ = dirs.append({'path': config_root ~ '/' ~ s.name, 'owner': puid, 'group': pgid}) %}
      {% endfor %}
      {{ dirs | to_json }}
  # Async to fire all at once
  async: 60
  poll: 0
  register: service_manager_dir_creation

- name: Wait for directory creation
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ service_manager_dir_creation.results }}"
  register: service_manager_dir_status
  until: service_manager_dir_status.finished
  retries: 30
  delay: 1
  loop_control:
    label: "{{ item.item.path }}"

- name: Deploy CI mock XML files
  ansible.builtin.copy:
    dest: "{{ service_manager_project_root }}/ci-mock/{{ item.file }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - file: ci-indexer.xml
      content: |
        <?xml version="1.0" encoding="UTF-8"?>
        <rss version="2.0" xmlns:torznab="http://torznab.com/schemas/2015/feed">
          <channel>
            <title>CI Internal Mock Indexer</title>
            <item>
              <title>Big Buck Bunny (2008)</title>
              <guid isPermaLink="false">ci-mock-1</guid>
              <link>http://ci-mock/ci-indexer.xml</link>
              <pubDate>Fri, 12 Jun 2026 12:00:00 +0000</pubDate>
              <size>1000000</size>
              <enclosure url="http://ci-mock/ci-indexer.xml" length="1000000" type="application/x-bittorrent" />
              <torznab:attr name="category" value="2000"/>
              <torznab:attr name="seeders" value="100"/>
              <torznab:attr name="peers" value="10"/>
            </item>
          </channel>
        </rss>
    - file: index.html
      content: |
        <html><body>CI Mock Active</body></html>
    - file: ci-caps.xml
      content: |
        <?xml version="1.0" encoding="UTF-8"?>
        <caps>
          <server title="CI Mock" />
          <categories>
            <category id="2000" name="Movies" />
          </categories>
        </caps>
    - file: nginx.conf
      content: |
        events {}
        http {
            include /etc/nginx/mime.types;
            server {
                listen 80;
                root /usr/share/nginx/html;
                location / {
                    if ($arg_t = "caps") {
                        rewrite ^ /ci-caps.xml break;
                    }
                    rewrite ^ /ci-indexer.xml break;
                }
            }
        }

- name: Run per-service pre-deploy configuration
  ansible.builtin.include_tasks: "per_service/{{ item.name }}.yml"
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}"
  when: "lookup('first_found', {'files': ['per_service/' + item.name + '.yml'], 'paths': [role_path + '/tasks/'], 'skip': true}) | length > 0"

- name: Deploy Servarr seeding script
  ansible.builtin.copy:
    src: scripts/seed-servarr.py
    dest: "{{ service_manager_project_root }}/seed-servarr/seed-servarr.py"
    mode: "0600"

- name: Ensure admin user exists in Servarr databases (Legacy cleanup)
  ansible.builtin.debug:
    msg: "Seeding now handled by init container in core stack."

- name: Render Grouped Docker Compose templates
  ansible.builtin.template:
    src: grouped_compose.yml.j2
    dest: "{{ service_manager_project_root }}/{{ item.name }}.yml"
    mode: "0644"
  loop: "{{ service_groups }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    group_name: "{{ item.name }}"

# We still need to reclaim names because we are changing project names (e.g. from 'sonarr' to 'servarr')
- name: Find containers occupying service names
  community.docker.docker_container_info:
    name: "{{ item.name }}"
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}"
  register: service_manager_container_info

- name: Reclaim names held by unmanaged containers
  community.docker.docker_container:
    name: "{{ _c.item.name }}"
    state: absent
  loop: "{{ service_manager_container_info.results }}"
  loop_control:
    loop_var: _c
    label: "{{ _c.item.name }}"
  when:
    - _c.exists | default(false)
    # Check if the project label matches the new group name
    - (((_c.container | default({})).Config | default({})).Labels | default({})).get('com.docker.compose.project', '') != _c.item.group

- name: Deploy Core Stack (includes Gluetun)
  community.docker.docker_compose_v2:
    project_name: core
    project_src: "{{ service_manager_project_root }}"
    files: ["core.yml"]
    state: present
    pull: missing
    remove_orphans: true
  register: service_manager_core_deploy
  when: not ansible_check_mode

- name: Wait for Gluetun to be healthy
  community.docker.docker_container_info:
    name: gluetun
  register: service_manager_gluetun_info
  until: service_manager_gluetun_info.container.State.Health.Status == 'healthy'
  retries: 30
  delay: 5
  when: "'gluetun' in services | map(attribute='name') | list"

- name: Deploy remaining Service Groups
  community.docker.docker_compose_v2:
    project_name: "{{ item.name }}"
    project_src: "{{ service_manager_project_root }}"
    files: ["{{ item.name }}.yml"]
    state: present
    pull: missing
    remove_orphans: true
    # Recreate if core (gluetun) changed
    recreate: "{{ 'always' if service_manager_core_deploy.changed | default(false) else 'auto' }}"
  loop: "{{ service_groups | rejectattr('name', 'equalto', 'core') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Run API wiring tasks
  ansible.builtin.include_tasks: api_wiring.yml
  when: not ansible_check_mode
- name: Run Audiobookshelf post-deploy provisioning
  ansible.builtin.include_tasks: audiobookshelf_post.yml
  when: "'audiobookshelf' in services | map(attribute='name') | list"
