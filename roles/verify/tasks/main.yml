---
# Orchestration role for verification.
#
# This role is intentionally split:
#   1. probes.yml: Static logic and host health (Dry-run safe)
#   2. integration_tests.yml: Live container/API testing (Production only)

- name: Run Static Probes
  ansible.builtin.include_tasks: probes.yml
  tags: ["verify", "probes", "dry-run"]

- name: Run Integration Tests
  ansible.builtin.include_tasks: integration_tests.yml
  when: not ansible_check_mode
  tags: ["verify", "integration"]
