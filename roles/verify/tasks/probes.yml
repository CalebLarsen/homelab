---
# Static Logic Validation (Check-mode friendly)
# These probes verify the intended state and host health without requiring
# running containers or live API access.

- name: Verify all service images are pinned to a digest
  ansible.builtin.assert:
    that: _unpinned | length == 0
    fail_msg: |-
      Unpinned service images — see docs/decisions/0006-pinned-image-digests.md:
      {% for s in _unpinned %}  - {{ s.name }}: {{ s.image }}
      {% endfor %}
  vars:
    _unpinned: >-
      {{ services
         | rejectattr('build_local', 'defined')
         | rejectattr('image', 'search', '@sha256:')
         | list }}

- name: Verify host storage pool
  ansible.builtin.shell:
    cmd: "set -o pipefail && mount | grep {{ storage.pool_path }} | grep fuse.mergerfs"
    executable: /bin/bash
  check_mode: false # Force probe of live kernel mount state
  register: verify_pool_check
  changed_when: false
  failed_when: verify_pool_check.rc != 0

- name: Read live mergerfs runtime options
  ansible.builtin.shell:
    cmd: "set -o pipefail && ps -ww -o args= -C mergerfs | head -1"
    executable: /bin/bash
  check_mode: false
  register: verify_mergerfs_args
  changed_when: false
  failed_when: verify_mergerfs_args.rc != 0

- name: Verify mergerfs cache.files is enabled (mmap support)
  ansible.builtin.assert:
    that:
      - >-
        'cache.files=partial' in verify_mergerfs_args.stdout
        or 'cache.files=full' in verify_mergerfs_args.stdout
        or 'cache.files=auto-full' in verify_mergerfs_args.stdout
    fail_msg: |
      mergerfs is mounted without `cache.files=partial` (or stronger).
      Live mergerfs args: {{ verify_mergerfs_args.stdout }}

- name: Verify Cloudflare Tunnel service
  ansible.builtin.systemd:
    name: cloudflared
    state: started
  check_mode: false
  register: verify_tunnel_status
  failed_when: verify_tunnel_status.status.ActiveState != 'active'

- name: Verify Docker service health (Running Services)
  # Check .State.Health.Status if it exists, otherwise fallback to .State.Status.
  # This ensures we catch 'unhealthy' containers that are technically 'running'.
  ansible.builtin.command:
    cmd: >-
      docker inspect -f
      '{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}{% endraw %}'
      {{ item.name }}
  loop: "{{ services | rejectattr('name', 'in', ['recyclarr', 'seed-servarr']) | list }}"
  check_mode: false
  register: verify_running_status
  until: verify_running_status.stdout in ['healthy', 'running']
  retries: 15
  delay: 5
  failed_when: >
    (verify_running_status.stdout not in ['healthy', 'running'])
  changed_when: false

- name: Verify Docker service health (One-shot Services)
  ansible.builtin.command: "docker inspect -f '{% raw %}{{.State.Status}} {{.State.ExitCode}}{% endraw %}' {{ item.name }}"
  loop: "{{ services | selectattr('name', 'in', ['recyclarr', 'seed-servarr']) | list }}"
  check_mode: false
  register: verify_oneshot_status
  failed_when: >
    (verify_oneshot_status.stdout.split(' ')[0] not in ['running', 'exited']) or
    (verify_oneshot_status.stdout.split(' ')[0] == 'exited' and verify_oneshot_status.stdout.split(' ')[1] != '0')
  changed_when: false
