---
# Group-level restart handlers.
# These align with the new grouped Docker Compose stacks.

- name: Restart core stack
  community.docker.docker_compose_v2:
    project_name: core
    project_src: "{{ homelab_project_root }}"
    files: ["core.yml"]
    state: restarted
  when: not ansible_check_mode
  listen:
    - Restart caddy
    - Restart gluetun

- name: Restart servarr stack
  community.docker.docker_compose_v2:
    project_name: servarr
    project_src: "{{ homelab_project_root }}"
    files: ["servarr.yml"]
    state: restarted
  when: not ansible_check_mode
  listen:
    - restart homelab_servarrs
    - Restart sonarr
    - Restart radarr
    - Restart prowlarr
    - Restart cleanuparr
    - Restart flaresolverr
    - Restart recyclarr

- name: Restart downloaders stack
  community.docker.docker_compose_v2:
    project_name: downloaders
    project_src: "{{ homelab_project_root }}"
    files: ["downloaders.yml"]
    state: restarted
  when: not ansible_check_mode
  listen:
    - Restart qbittorrent
    - Restart cross-seed
    - Restart audiobookbay-automated

- name: Restart media stack
  community.docker.docker_compose_v2:
    project_name: media
    project_src: "{{ homelab_project_root }}"
    files: ["media.yml"]
    state: restarted
  when: not ansible_check_mode
  listen:
    - Restart bazarr
    - Restart audiobookshelf
    - Restart seerr
    - Restart plex
    - Restart tautulli
    - Restart kometa

- name: Restart utils stack
  community.docker.docker_compose_v2:
    project_name: utils
    project_src: "{{ homelab_project_root }}"
    files: ["utils.yml"]
    state: restarted
  when: not ansible_check_mode
  listen:
    - Restart discord-bridge
    - Restart anki
    - Restart phone-logger
    - Restart webhook
