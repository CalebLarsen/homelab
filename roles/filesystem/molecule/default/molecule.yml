---
dependency:
  name: shell
  command: "true"
driver:
  name: docker
platforms:
  - name: instance
    image: python:3.11-slim-bookworm
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
