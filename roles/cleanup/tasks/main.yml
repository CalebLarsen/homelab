---
# Cleanup tasks to reset homelab state.
# This role is intended to be run manually or as a pre-deploy reset.

- name: Tear down service Compose projects
  community.docker.docker_compose_v2:
    project_src: "services/{{ item.name }}"
    state: absent
    remove_orphans: true
    remove_volumes: false
  loop: "{{ services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop cloudflared systemd service
  ansible.builtin.systemd:
    name: cloudflared
    state: stopped
  # Not an error if the service was never installed.
  failed_when: false

- name: Prune stopped containers
  community.docker.docker_prune:
    containers: true

- name: Remove configuration directory
  ansible.builtin.file:
    path: "{{ config_root }}"
    state: absent

- name: Recreate empty configuration directory
  ansible.builtin.file:
    path: "{{ config_root }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"
