---
- name: Fetch available indexer definitions from Prowlarr
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/indexer/schema"
    method: GET
    headers: { X-Api-Key: "{{ api_keys.prowlarr }}" }
    status_code: 200
  register: homelab_indexer_defs
  no_log: true

- name: Fetch currently configured proxies in Prowlarr
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/indexerproxy"
    method: GET
    headers: { X-Api-Key: "{{ api_keys.prowlarr }}" }
    status_code: 200
  register: homelab_current_proxies
  no_log: true

- name: Ensure Flaresolverr proxy is configured
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/indexerproxy"
    method: POST
    headers: { X-Api-Key: "{{ api_keys.prowlarr }}" }
    body_format: json
    body:
      name: "FlareSolverr"
      implementation: "FlareSolverr"
      configContract: "FlareSolverrSettings"
      fields:
        - { name: "baseUrl", value: "http://flaresolverr:8191" }
    status_code: [200, 201]
  when:
    - homelab_current_proxies.json is defined
    - "homelab_current_proxies.json | selectattr('name', 'equalto', 'FlareSolverr') | list | length == 0"
  no_log: true

- name: Fetch currently configured indexers in Prowlarr
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/indexer"
    method: GET
    headers: { X-Api-Key: "{{ api_keys.prowlarr }}" }
    status_code: 200
  register: homelab_current_indexers
  no_log: true

- name: Ensure Prowlarr indexers are configured and enabled
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/indexer{{ '/' + (existing_indexer.id | string) if existing_indexer else '' }}?forceSave=true"
    method: "{{ 'PUT' if existing_indexer else 'POST' }}"
    headers: { X-Api-Key: "{{ api_keys.prowlarr }}" }
    body_format: json
    body:
      id: "{{ existing_indexer.id | default(omit) }}"
      name: "{{ indexer_def.name }}"
      implementation: "{{ indexer_def.implementation }}"
      configContract: "{{ indexer_def.configContract }}"
      appProfileId: 1
      protocol: "torrent"
      priority: 25
      privacy: "{{ indexer_def.privacy }}"
      fields: "{{ indexer_def.fields }}"
      enable: true
      syncLevel: "fullSync"
      tags: []
    status_code: [200, 201, 202, 400] # 400 allowed because forceSave might still report site-down errors
  loop: "{{ prowlarr_indexers }}"
  loop_control:
    loop_var: target_indexer
  vars:
    _matching_def: >-
      {{ homelab_indexer_defs.json | default([])
         | selectattr('name', 'equalto', target_indexer) | list }}
    _matching_existing: >-
      {{ homelab_current_indexers.json | default([])
         | selectattr('name', 'equalto', target_indexer) | list }}
    indexer_def: "{{ _matching_def | first if _matching_def | length > 0 else none }}"
    existing_indexer: "{{ _matching_existing | first if _matching_existing | length > 0 else none }}"
  when:
    - indexer_def is not none
    - homelab_indexer_defs.json is defined
    - homelab_current_indexers.json is defined
  # Final safety: don't let a single indexer site-down event crash the deploy.
  failed_when: false
  no_log: true

- name: Configure CI-Internal indexer using live schema
  ansible.builtin.uri:
    url: "http://localhost:9696/api/v1/indexer{{ '/' + (existing_ci.id | string) if existing_ci else '' }}?forceSave=true"
    method: "{{ 'PUT' if existing_ci else 'POST' }}"
    headers: { X-Api-Key: "{{ api_keys.prowlarr }}" }
    body_format: json
    body:
      id: "{{ existing_ci.id | default(omit) }}"
      name: "CI-Internal"
      implementation: "{{ torznab_def.implementation }}"
      configContract: "{{ torznab_def.configContract }}"
      appProfileId: 1
      protocol: "torrent"
      priority: 1
      enable: true
      syncLevel: "fullSync"
      fields: "{{ final_fields | from_json }}"
    status_code: [200, 201, 202]
  vars:
    torznab_def: "{{ homelab_indexer_defs.json | selectattr('implementation', 'equalto', 'Torznab') | first }}"
    existing_ci: "{{ homelab_current_indexers.json | default([]) | selectattr('name', 'equalto', 'CI-Internal') | list | first | default(none) }}"
    # Build the fields list as a JSON string first to ensure type safety
    final_fields: >-
      {% set fields = [] %}
      {% for f in torznab_def.fields %}
        {% if f.name == 'baseUrl' %}{% set _ = fields.append(f | combine({'value': 'http://ci-mock/'})) %}
        {% elif f.name == 'apiPath' %}{% set _ = fields.append(f | combine({'value': '/'})) %}
        {% elif f.name == 'apiKey' %}{% set _ = fields.append(f | combine({'value': 'ci-mock-key'})) %}
        {% elif f.name == 'categories' %}{% set _ = fields.append(f | combine({'value': [2000]})) %}
        {% else %}{% set _ = fields.append(f) %}{% endif %}
      {% endfor %}
      {{ fields | to_json }}
  when:
    - homelab_current_indexers.json is defined
    - homelab_indexer_defs.json is defined
  no_log: true
